<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="scripture-api.js"></script>
  <script type="module" src="book.js"></script>
  <script type="module" src="./search.js"></script>
  <script type="module" src="tab-state.js"></script>

  <title>Select a Book | jotBible</title>
</head>

<body>

  <header>
    <h1>
      <a class="flex" href="/">jotBible<svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2v8l3-3 3 3V2"/><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/></svg></a>
    </h1>
    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-toggle-label" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </label>
    <div class="nav">
      <a data-tab="read" href="book.html" class="translation-select-label" aria-current="page">Read<svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg></a>
      <a class="flex" data-tab="study" href="/study.html">Study<svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 18V5"/><path d="M15 13a4.17 4.17 0 0 1-3-4 4.17 4.17 0 0 1-3 4"/><path d="M17.598 6.5A3 3 0 1 0 12 5a3 3 0 1 0-5.598 1.5"/><path d="M17.997 5.125a4 4 0 0 1 2.526 5.77"/><path d="M18 18a4 4 0 0 0 2-7.464"/><path d="M19.967 17.483A4 4 0 1 1 12 18a4 4 0 1 1-7.967-.517"/><path d="M6 18a4 4 0 0 1-2-7.464"/><path d="M6.003 5.125a4 4 0 0 0-2.526 5.77"/></svg></a>
      <a class="flex" data-tab="notes" href="/notes.html">Notes<svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4"/><path d="M2 6h4"/><path d="M2 10h4"/><path d="M2 14h4"/><path d="M2 18h4"/><path d="M21.378 5.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/></svg></a>
    </div>
    <label for="nav-toggle" class="nav-backdrop" aria-hidden="true"></label>
    <form id="search-form">
      <input id="search-input" aria-label="Search" placeholder="Search" type="text">
      <button type="submit" aria-label="Search"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
      <div id="search-dropdown" hidden>
        <div class="search-scope" role="group" aria-label="Filter results">
          <span class="search-scope-label" aria-hidden="true">Filter</span>
          <label><input type="checkbox" name="search-scope" value="ot"><span>OT</span></label>
          <label><input type="checkbox" name="search-scope" value="nt"><span>NT</span></label>
          <label><input type="checkbox" name="search-scope" value="notes"><span>Notes</span></label>
          <button type="button" class="search-scope-clear" hidden>Clear</button>
        </div>
        <ul id="search-results"></ul>
      </div>
    </form>
  </header>

  <main class="container">
    <div class="bookmarks">
      <button type="button" id="bookmarks-toggle" class="btn" aria-expanded="false" aria-controls="bookmarks-panel"><span class="bookmarks-toggle-label">Bookmarks</span><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg></button>
      <div id="bookmarks-panel" hidden>
        <ul id="bookmarks-list"></ul>
        <p id="bookmarks-empty" hidden>No bookmarks yet. Open a chapter and tap <strong>Bookmark</strong> to save your place. <a href="#book-list" id="bookmarks-start">Choose a book to start reading</a></p>
      </div>
    </div>

    <div id="book-list">
      <div class="OTWrapper">
        <details class="testament" data-testament="OT" open>
          <summary><h2>Old Testament</h2></summary>
          <div id="OT"></div>
        </details>
      </div>
      <div class="NTWrapper">
        <details class="testament" data-testament="NT" open>
          <summary><h2>New Testament</h2></summary>
          <div id="NT"></div>
        </details>
      </div>
    </div>
  </main>

</body>

</html>

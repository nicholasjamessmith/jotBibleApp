<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="scripture-api.js"></script>
  <script type="module" src="note-view.js"></script>
  <script type="module" src="./search.js"></script>

  <title>View Note</title>
</head>

<body>

  <header>
    <h1>
      <a class="flex" href="/">jotBible<svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2v8l3-3 3 3V2"/><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/></svg></a>
    </h1>
    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-toggle-label" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </label>
    <div class="nav">
      <a href="book.html" class="translation-select-label">Read<svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg></a>
      <a class="flex" href="/study.html">Study<svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 18V5"/><path d="M15 13a4.17 4.17 0 0 1-3-4 4.17 4.17 0 0 1-3 4"/><path d="M17.598 6.5A3 3 0 1 0 12 5a3 3 0 1 0-5.598 1.5"/><path d="M17.997 5.125a4 4 0 0 1 2.526 5.77"/><path d="M18 18a4 4 0 0 0 2-7.464"/><path d="M19.967 17.483A4 4 0 1 1 12 18a4 4 0 1 1-7.967-.517"/><path d="M6 18a4 4 0 0 1-2-7.464"/><path d="M6.003 5.125a4 4 0 0 0-2.526 5.77"/></svg></a>
      <a class="flex" href="/notes.html" aria-current="page">Notes<svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4"/><path d="M2 6h4"/><path d="M2 10h4"/><path d="M2 14h4"/><path d="M2 18h4"/><path d="M21.378 5.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/></svg></a>
    </div>
    <label for="nav-toggle" class="nav-backdrop" aria-hidden="true"></label>
    <form id="search-form">
      <input id="search-input" title="search" label="search" placeholder="Search" type="text">
      <button type="submit" aria-label="Search"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
      <ul id="search-results"></ul>
    </form>
  </header>

  <main class="container">
    <a href="notes.html" class="note-back">&larr; All notes</a>

    <p id="note-not-found" hidden>This note doesn't exist or was deleted.</p>

    <article id="note-view" class="card-tile note-page" hidden>
      <p id="note-text" class="card-dialog-text"></p>
      <div class="card-meta"><span id="note-date" class="card-date"></span></div>
      <div class="card-dialog-actions">
        <button type="button" id="note-edit-btn" class="btn btn-black">Edit</button>
      </div>
    </article>

    <form id="note-edit-form" class="card-tile card-dialog-form note-page" hidden>
      <textarea id="note-edit-input" class="card-dialog-input" rows="10" required></textarea>
      <div class="card-dialog-actions">
        <button type="button" id="note-delete-btn" class="btn btn-danger">Delete</button>
        <button type="button" id="note-cancel-btn" class="btn btn-red">Cancel</button>
        <button type="submit" class="card-composer-submit btn btn-blue">Save</button>
      </div>
    </form>

    <dialog id="delete-dialog" class="card-dialog" aria-labelledby="delete-dialog-title">
      <h2 id="delete-dialog-title" class="card-dialog-title">Delete this note?</h2>
      <form method="dialog" class="card-dialog-actions">
        <button value="cancel" class="btn btn-red">Cancel</button>
        <button value="confirm" class="card-composer-submit btn btn-danger">Delete</button>
      </form>
    </dialog>
  </main>

</body>

</html>

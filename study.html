<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="scripture-api.js"></script>
  <script type="module" src="study.js"></script>
  <script type="module" src="./search.js"></script>

  <title>Study</title>
</head>

<body>

  <header>
    <h1>
      <a class="flex" href="/">jotBible</a>
    </h1>
  </header>

  <div class="nav">
    <a href="book.html" class="translation-select-label">Book</a>
    <a class="flex" href="/study.html" aria-current="page">Study</a>
    <a class="flex" href="/notes.html">Notes</a>
    <form id="search-form">
      <input id="search-input" title="search" label="search" placeholder="Search" type="text">
      <input title="submit" label="submit" type="submit">
      <ul id="search-results"></ul>
    </form>
  </div>

  <main class="container">
    <div id="flashcards" class="card-feed">
      <button type="button" id="new-card-btn" class="btn btn-blue">+ New Card</button>

      <form id="new-card-form" class="card-tile card-dialog-form" hidden>
        <label for="new-card-side-a">Reference</label>
        <input id="new-card-side-a" class="card-dialog-input" type="text" placeholder="e.g. John 3:16" required>
        <label for="new-card-side-b">Scripture</label>
        <textarea id="new-card-side-b" class="card-dialog-input" rows="4"
          placeholder="e.g. For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life."
          required></textarea>
        <div class="card-dialog-actions">
          <button type="button" id="new-card-cancel-btn" class="btn btn-red">Cancel</button>
          <button type="submit" class="card-composer-submit btn btn-blue">Add Card</button>
        </div>
      </form>

      <div id="card-list"></div>
    </div>

    <template id="card-template">
      <button type="button" class="card-tile card-tile--entry">
        <span class="flashcard-reference"></span>
      </button>
    </template>

    <dialog id="view-modal" class="card-dialog">
      <button type="button" id="view-modal-close-btn" class="card-dialog-close btn btn-red" aria-label="Close">&times;</button>
      <button type="button" id="view-modal-flip" class="flashcard-flip">
        <span class="flashcard-inner">
          <span class="flashcard-face flashcard-face--front">
            <span class="flashcard-label">Reference</span>
            <span id="view-modal-reference" class="flashcard-reference"></span>
          </span>
          <span class="flashcard-face flashcard-face--back">
            <span class="flashcard-label">Scripture</span>
            <span id="view-modal-scripture" class="flashcard-scripture"></span>
          </span>
        </span>
      </button>
      <div class="card-dialog-actions">
        <button type="button" id="view-modal-edit-btn" class="btn btn-black">Edit</button>
      </div>
    </dialog>

    <dialog id="card-modal" class="card-dialog">
      <button type="button" id="card-modal-close-btn" class="card-dialog-close btn btn-red" aria-label="Close">&times;</button>
      <form id="card-modal-form" class="card-dialog-form">
        <label for="card-modal-side-a">Reference</label>
        <input id="card-modal-side-a" class="card-dialog-input" type="text" required>
        <label for="card-modal-side-b">Scripture</label>
        <textarea id="card-modal-side-b" class="card-dialog-input" rows="6" required></textarea>
        <div class="card-dialog-actions">
          <button type="button" id="card-delete-btn" class="btn btn-red">Delete</button>
          <button type="submit" class="card-composer-submit btn btn-blue">Save</button>
        </div>
      </form>
    </dialog>
  </main>

</body>

</html>

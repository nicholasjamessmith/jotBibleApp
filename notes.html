      <input id="search-input" aria-label="Search" placeholder="Search" type="text">
      <button type="submit" aria-label="Search"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>

        <div class="search-scope" role="group" aria-label="Filter results">
          <span class="search-scope-label" aria-hidden="true">Filter</span>
          <label><input type="checkbox" name="search-scope" value="ot"><span>OT</span></label>
          <label><input type="checkbox" name="search-scope" value="nt"><span>NT</span></label>

  <main class="container">
    <div id="notes" class="card-feed">
      <button type="button" id="new-note-btn" class="btn btn-blue">+ New Note</button>

      <form id="new-note-form" class="card-tile card-dialog-form" hidden>
        <textarea id="new-note-input" class="card-dialog-input" rows="4" placeholder="Enter note here.." required></textarea>
        <div class="card-dialog-actions">
          <button type="button" id="new-note-cancel-btn" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="card-composer-submit btn btn-blue">Add Note</button>
        </div>
      </form>

      <div class="note-pager" aria-roledescription="carousel" aria-label="Notes">
        <button type="button" class="pager-arrow pager-prev" aria-label="Previous page" hidden><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
        <div class="note-viewport">
          <div id="note-list"></div>
        </div>
        <button type="button" class="pager-arrow pager-next" aria-label="Next page" hidden><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
      <p class="pager-status" aria-live="polite" hidden></p>
    </div>

    <template id="note-template">
      <a class="card-tile card-tile--entry">
        <p class="card-preview-text"></p>
        <div class="card-meta"><span class="card-date"></span></div>
      </a>
    </template>
  </main>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="scripture-api.js"></script>
  <script type="module" src="notes.js"></script>
  <script type="module" src="./search.js"></script>

  <title>Notes</title>
</head>

<body>

  <header>
    <h1>
      <a class="flex" href="/">jotBible</a>
    </h1>
    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-toggle-label" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </label>
    <div class="nav">
      <a href="book.html" class="translation-select-label">Book</a>
      <a class="flex" href="/study.html">Study</a>
      <a class="flex active" href="/notes.html" aria-current="page">Notes</a>
    </div>
    <label for="nav-toggle" class="nav-backdrop" aria-hidden="true"></label>
    <form id="search-form">
      <input id="search-input" title="search" label="search" placeholder="Search" type="text">
      <input title="submit" label="submit" type="submit">
      <ul id="search-results"></ul>
    </form>
  </header>

  <main class="container">
    <div id="notes" class="card-feed">
      <button type="button" id="new-note-btn" class="btn btn-blue">+ New Note</button>

      <form id="new-note-form" class="card-tile card-dialog-form" hidden>
        <textarea id="new-note-input" class="card-dialog-input" rows="4" placeholder="Enter note here.." required></textarea>
        <div class="card-dialog-actions">
          <button type="button" id="new-note-cancel-btn" class="btn btn-red">Cancel</button>
          <button type="submit" class="card-composer-submit btn btn-blue">Add Note</button>
        </div>
      </form>

      <div id="note-list"></div>
    </div>

    <template id="note-template">
      <button class="card-tile card-tile--entry" type="button">
        <p class="card-preview-text"></p>
        <div class="card-meta"><span class="card-date"></span></div>
      </button>
    </template>

    <dialog id="view-modal" class="card-dialog">
      <button type="button" id="view-modal-close-btn" class="card-dialog-close btn btn-red" aria-label="Close">&times;</button>
      <p id="view-modal-text" class="card-dialog-text"></p>
      <div class="card-dialog-actions">
        <button type="button" id="view-modal-edit-btn" class="btn btn-black">Edit</button>
      </div>
    </dialog>

    <dialog id="modal" class="card-dialog">
      <button type="button" id="modal-close-btn" class="card-dialog-close btn btn-red" aria-label="Close">&times;</button>
      <form id="modal-form" class="card-dialog-form">
        <textarea id="modal-input" class="card-dialog-input" rows="6" required></textarea>
        <div class="card-dialog-actions">
          <button type="button" id="modal-delete-btn" class="btn btn-red">Delete</button>
          <button type="submit" class="card-composer-submit btn btn-blue">Save</button>
        </div>
      </form>
    </dialog>
  </main>

</body>

</html>
